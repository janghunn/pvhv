    <text x="144.7" y="94" text-anchor="end" font-size="17" fill="#1d1b18"><tspan font-style="italic">p</tspan>′</text>
    <circle cx="188" cy="180" r="4.5" fill="#fff" stroke="#1d1b18" stroke-width="1.6"/>
