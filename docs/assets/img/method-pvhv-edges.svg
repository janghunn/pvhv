    <circle cx="212" cy="252" r="14" fill="#ffffff" stroke="#1d1b18" stroke-width="2"/><text x="212" y="258" text-anchor="middle" font-size="17" fill="#1d1b18"><tspan font-style="italic">s</tspan></text>
    <text x="168" y="258" text-anchor="middle" font-size="15" fill="#0072b2"><tspan font-style="italic">N</tspan></text>
