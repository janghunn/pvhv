    <text x="43" y="38" text-anchor="start" font-size="15" fill="#5c564c"><tspan font-style="italic">z</tspan></text>
    <path d="M36 252H108" stroke="#5c564c" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M36 180H188" stroke="#5c564c" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M31 180h10" stroke="#5c564c" stroke-width="1.6"/>
    <text x="27" y="185" text-anchor="end" font-size="15" fill="#5c564c"><tspan font-style="italic">f</tspan><tspan font-size="14" dy="4" font-style="italic">z</tspan><tspan dy="-4"></tspan></text>
    <path d="M36 114H166" stroke="#5c564c" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M31 114h10" stroke="#5c564c" stroke-width="1.6"/>
    <text x="27" y="119" text-anchor="end" font-size="15" fill="#5c564c"><tspan font-style="italic">g</tspan><tspan font-size="14" dy="4" font-style="italic">z</tspan><tspan dy="-4"></tspan></text>
    <path d="M36 74H152.7" stroke="#5c564c" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M31 74h10" stroke="#5c564c" stroke-width="1.6"/>
    <text x="27" y="79" text-anchor="end" font-size="15" fill="#5c564c"><tspan font-style="italic">p</tspan><tspan font-size="14" dy="4" font-style="italic">z</tspan><tspan dy="-4"></tspan></text>
    <rect x="128" y="108" width="38" height="12" rx="1.5" fill="#ece7dc" stroke="#1d1b18" stroke-width="1.6"/>
