<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
  <title id="title">PVHV of linear novel views from the edge rays through a foreground fragment</title>
  <desc id="desc">Cross-section after Fig. 3(a) of the paper. Novel views N span a distance E from the source view s to the farthest novel view n. The edge ray e(s,f) from s and the edge ray e(n,f) from n pass through the edge f of the inner blocker; the outer blocker g lies farther, on e(s,f). The green triangle between the two rays beyond f is the PVHV H_s(N). At the depth of a tested point p, it spans a segment of length R from p' on e(s,f).</desc>
