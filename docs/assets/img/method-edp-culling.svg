    <text x="96" y="230" text-anchor="start" font-size="15" fill="#5c564c">fragments of <tspan font-style="italic">h</tspan> = 1</text>
    <rect x="8" y="296" width="13" height="13" rx="2" fill="#0d7352"/>
    <text x="27" y="308" text-anchor="start" font-size="15" fill="#1d1b18">kept</text>
    <rect x="77" y="297" width="11" height="11" rx="2" fill="#e69f00" fill-opacity=".28" stroke="#d55e00" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="95" y="308" text-anchor="start" font-size="15" fill="#1d1b18">culled (EDP)</text>
    <rect x="200" y="296" width="13" height="13" rx="2" fill="#5c564c"/>
