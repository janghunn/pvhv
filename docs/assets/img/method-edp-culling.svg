    <text x="8" y="279" text-anchor="start" font-size="15" fill="#1d1b18" font-weight="700">EDP</text>
    <rect x="100" y="268" width="13" height="13" rx="2" fill="#0d7352"/>
    <rect x="116.5" y="268" width="13" height="13" rx="2" fill="#0d7352"/>
