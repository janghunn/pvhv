<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
  <title id="title">Effective Depth Peeling keeps hidden fragments inside PVHVs and culls the rest</title>
  <desc id="desc">Cross-section after Sec. 4.1 and Fig. 7 of the paper. Behind a foreground layer (h = 0) with edge f, the first hidden layer (h = 1) is split into fragments. Baseline depth peeling (BDP) keeps every fragment (grey). Effective Depth Peeling (EDP) keeps the fragments inside the PVHV between the edge rays from s and n (green) and culls the others (dashed orange).</desc>
