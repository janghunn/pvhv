    <rect x="150" y="145" width="202" height="10" fill="#ece7dc" stroke="#1d1b18" stroke-width="1.6"/>
    <circle cx="150" cy="150" r="4.5" fill="#fff" stroke="#1d1b18" stroke-width="1.6"/>
    <text x="141" y="155" text-anchor="end" font-size="17" fill="#1d1b18"><tspan font-style="italic">f</tspan></text>
    <text x="352" y="174" text-anchor="end" font-size="15" fill="#1d1b18">foreground, <tspan font-style="italic">h</tspan> = 0</text>
    <text x="352" y="44" text-anchor="end" font-size="15" fill="#1d1b18" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hidden layer, <tspan font-style="italic">h</tspan> = 1</text>
    <text x="214" y="116" text-anchor="middle" font-size="15" fill="#0d7352" font-weight="700" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">PVHV</text>
    <circle cx="114" cy="196" r="14" fill="#e6f1f8" stroke="#0072b2" stroke-width="2"/><text x="114" y="202" text-anchor="middle" font-size="17" fill="#0072b2"><tspan font-style="italic">n</tspan></text>
    <circle cx="176" cy="196" r="14" fill="#ffffff" stroke="#1d1b18" stroke-width="2"/><text x="176" y="202" text-anchor="middle" font-size="17" fill="#1d1b18"><tspan font-style="italic">s</tspan></text>
    <rect x="100" y="51.5" width="13" height="13" rx="2" fill="#0d7352"/>
